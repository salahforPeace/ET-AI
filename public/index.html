<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ET AI — crypto terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<style>
  :root{
    --bg:#050807;
    --surface:#0a110d;
    --surface-2:#0d1712;
    --surface-3:#132018;
    --border:#173225;
    --text:#d9ffe9;
    --text-dim:#7fa38d;
    --text-faint:#4d6b5a;
    --accent:#3dffa0;
    --accent-2:#1c8f5c;
    --accent-dim:rgba(61,255,160,.14);
    --accent-text:#03170f;
    --gold:#f0b90b;
    --danger:#ff5c5c;
    --radius:6px;
    --topbar-h:52px;
  }
  :root[data-scheme="amber"]{
    --accent:#ffb000; --accent-2:#a86e00; --accent-dim:rgba(255,176,0,.14); --accent-text:#1a1100;
    --text:#ffe9c2; --text-dim:#b08a52; --text-faint:#6b5530;
  }
  :root[data-scheme="cyan"]{
    --accent:#37e6ff; --accent-2:#1490a8; --accent-dim:rgba(55,230,255,.14); --accent-text:#031418;
    --text:#d7fbff; --text-dim:#6fa8b3; --text-faint:#3f6a72;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent;
  }
  svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}

  /* ---------- backdrops / fx ---------- */
  #rain{ position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:.14; pointer-events:none; }
  #btcLayer{ position:fixed; inset:0; width:100%; height:100%; z-index:1; opacity:.9; pointer-events:none; }
  .scanlines{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode: overlay;
  }
  .vignette{ position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 35%, transparent 45%, rgba(0,0,0,.5) 100%); }

  #backdrop{ position:fixed; inset:0; background:rgba(2,4,3,.6); z-index:55; display:none; }
  #backdrop.show{ display:block; }

  /* ---------- sidebar ---------- */
  #sidebar{
    width:250px; min-width:250px; height:100vh;
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:60; position:relative;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding:14px 12px; border-bottom:1px solid var(--border); }
  .brand-mark{
    width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;
  }
  .brand-name{font-weight:700;font-size:14px;color:var(--accent);}
  .brand-sub{font-size:10px;color:var(--text-faint);margin-top:1px;}
  #closeSidebarBtn{ display:none; background:none;border:none;color:var(--text-dim);padding:6px;border-radius:var(--radius);cursor:pointer;margin-left:auto; }

  #newChatBtn{
    margin:12px 12px 6px; padding:9px 11px; background:transparent; color:var(--accent);
    border:1px solid var(--accent-2); border-radius:var(--radius); font-family:inherit;
    font-weight:600; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  #newChatBtn:hover{ background:var(--accent-dim); }
  #chatList{ flex:1; overflow-y:auto; padding:6px 8px; display:flex; flex-direction:column; gap:2px; }
  .chat-item{
    padding:8px 9px; border-radius:var(--radius); font-size:12px; color:var(--text-dim);
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .chat-item .pre{ color:var(--text-faint); flex:none; }
  .chat-item:hover{ background:var(--surface-2); color:var(--text); }
  .chat-item.active{ background:var(--surface-3); color:var(--accent); border-left:2px solid var(--accent); padding-left:7px; }
  .chat-item .clabel{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-item .del{ opacity:0; color:var(--text-faint); flex:none; padding:3px; border-radius:5px; display:flex; }
  .chat-item:hover .del{ opacity:1; }
  .chat-item .del:hover{ color:var(--danger); }
  @media (hover:none){ .chat-item .del{ opacity:.5; } }

  #sidebarFoot{ border-top:1px solid var(--border); padding:10px; }
  #settingsBtn{
    width:100%; background:none; border:1px solid var(--border); color:var(--text-dim);
    padding:8px 9px; border-radius:var(--radius); font-size:12px; cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:8px; font-family:inherit;
  }
  #settingsBtn:hover{ color:var(--accent); border-color:var(--accent-2); }

  /* ---------- main ---------- */
  #main{ flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; position:relative; z-index:1; }
  #topbar{
    height:var(--topbar-h); flex:none; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:9px; padding:0 12px;
    background:rgba(5,8,7,.85); position:relative; z-index:10;
  }
  #menuBtn{ display:none; background:none;border:none;color:var(--text-dim);padding:6px;border-radius:var(--radius);cursor:pointer;flex:none; }
  #menuBtn:hover{ color:var(--accent); }
  .status-dot{ width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);flex:none;animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  #chatTitle{ font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #chatTitle b{ color:var(--accent); font-weight:600; }

  .topbtn{
    background:none; border:1px solid var(--border); color:var(--text-dim); font-family:inherit;
    padding:6px 9px; border-radius:var(--radius); font-size:11px; cursor:pointer; flex:none;
    display:flex; align-items:center; gap:6px;
  }
  .topbtn:hover{ color:var(--accent); border-color:var(--accent-2); }
  .topbtn.live{ color:var(--accent); border-color:var(--accent-2); }
  .topbtn .liveDot{ width:5px;height:5px;border-radius:50%;background:var(--accent);display:none; }
  .topbtn.live .liveDot{ display:block; box-shadow:0 0 0 3px var(--accent-dim); }

  /* ---------- ticker ---------- */
  .ticker-wrap{
    border-bottom:1px solid var(--border); background:rgba(0,0,0,.28); overflow:hidden;
    white-space:nowrap; flex:none; position:relative;
  }
  .ticker-wrap::before,.ticker-wrap::after{ content:""; position:absolute; top:0; bottom:0; width:26px; z-index:2; }
  .ticker-wrap::before{ left:0; background:linear-gradient(90deg,var(--bg),transparent); }
  .ticker-wrap::after{ right:0; background:linear-gradient(270deg,var(--bg),transparent); }
  .ticker{ display:inline-flex; padding:6px 0; animation:scroll 26s linear infinite; }
  .ticker span{ padding:0 20px; font-size:11px; color:var(--text-dim); border-right:1px solid var(--border); }
  .ticker span b{ color:var(--gold); font-weight:600; margin-right:6px; }
  .ticker span.up{ color:var(--accent); } .ticker span.down{ color:var(--danger); }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion:reduce){ .ticker{animation:none;} .status-dot{animation:none;} }

  /* ---------- body ---------- */
  #body-wrap{ flex:1; display:flex; min-height:0; position:relative; }
  #chatCol{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages{ flex:1; overflow-y:auto; padding:18px 0 8px; }
  #messages::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb{ background:var(--accent-2); border-radius:4px; }

  .msg-row{ max-width:760px; margin:0 auto 18px; padding:0 18px; display:flex; gap:10px; animation:rise .2s ease both; font-size:13px; }
  @keyframes rise{ from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }
  .msg-row .tag{ flex:none; font-size:11px; padding-top:2px; width:64px; text-align:right; color:var(--text-faint); }
  .msg-row.user .tag{ color:var(--gold); }
  .msg-row.assistant .tag{ color:var(--accent); }
  .msg-body{ flex:1; min-width:0; }
  .msg-bubble{ border-left:2px solid var(--border); padding:2px 0 2px 12px; }
  .msg-row.assistant .msg-bubble{ border-left-color:var(--accent-2); }
  .msg-row.user .msg-bubble{ border-left-color:var(--gold); }
  .msg-text{ font-size:13.5px; line-height:1.62; word-wrap:break-word; color:var(--text); }
  .msg-text.plain{ white-space:pre-wrap; }
  .msg-text a{ color:var(--accent); }
  .msg-text p{ margin:0 0 9px; } .msg-text p:last-child{ margin-bottom:0; }
  .msg-text h1,.msg-text h2,.msg-text h3{ margin:14px 0 7px; font-weight:700; color:var(--accent); }
  .msg-text h1:first-child,.msg-text h2:first-child,.msg-text h3:first-child{ margin-top:0; }
  .msg-text h1{font-size:16.5px;} .msg-text h2{font-size:15px;} .msg-text h3{font-size:14px;}
  .msg-text ul,.msg-text ol{ margin:0 0 9px; padding-left:20px; }
  .msg-text li{ margin:3px 0; }
  .msg-text strong{ color:var(--accent); font-weight:700; }
  .msg-text code{ background:var(--surface-3); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:12px; }
  .msg-text pre{ background:#03100a; border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; overflow-x:auto; margin:0 0 9px; }
  .msg-text pre code{ background:none;border:none;padding:0;font-size:12px;line-height:1.5;color:var(--text); }
  .msg-text blockquote{ margin:0 0 9px; padding:1px 12px; border-left:2px solid var(--accent); color:var(--text-dim); }
  .msg-text table{ border-collapse:collapse; margin:0 0 9px; width:100%; font-size:12px; }
  .msg-text th,.msg-text td{ border:1px solid var(--border); padding:5px 8px; text-align:left; }
  .msg-text th{ background:var(--surface-3); color:var(--accent); }
  .cursor-blink{ display:inline-block; width:6px; height:1em; background:var(--accent); vertical-align:text-bottom; margin-left:1px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  .msg-attachments{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .attach-thumb{ width:140px;height:104px;border-radius:4px;object-fit:cover;border:1px solid var(--border);cursor:pointer;filter:saturate(.85) contrast(1.05); }
  .file-card{
    display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:8px 10px; margin-top:8px; max-width:300px;
  }
  .file-card .fico{ width:30px;height:30px;border-radius:5px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent); }
  .file-card .finfo{ flex:1; min-width:0; font-size:11.5px; }
  .file-card .fname{ color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-card .fmeta{ color:var(--text-faint); font-size:10.5px; }
  .file-card .fbtn{ background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:5px; padding:4px 9px; font-size:10.5px; cursor:pointer; flex:none; font-family:inherit; }
  .file-card .fbtn:hover{ color:var(--accent); border-color:var(--accent-2); }

  #emptyState{ max-width:560px; margin:8vh auto 0; text-align:center; padding:0 20px; }
  #emptyState .brand-mark{ width:44px;height:44px;border-radius:9px;margin:0 auto 16px;font-size:15px; }
  #emptyState h1{ font-size:18px; margin:0 0 8px; color:var(--accent); font-weight:700; }
  #emptyState p{ color:var(--text-dim); font-size:12.5px; line-height:1.6; margin:0 0 18px; }
  #suggestions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .sugg-chip{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 12px; border-radius:var(--radius); font-size:11.5px; cursor:pointer; text-align:left; font-family:inherit;
  }
  .sugg-chip:hover{ border-color:var(--accent-2); color:var(--accent); }

  /* ---------- composer ---------- */
  #composerWrap{ padding:10px 14px 14px; border-top:1px solid var(--border); flex:none; }
  #composerInner{ max-width:760px; margin:0 auto; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:6px 6px 6px 12px; transition:border-color .15s; }
  #composerInner:focus-within{ border-color:var(--accent-2); }
  #pendingFiles{ display:flex; flex-wrap:wrap; gap:7px; padding:5px 0 7px; }
  .pending-chip{ display:flex; align-items:center; gap:6px; background:var(--surface-3); border-radius:5px; padding:4px 8px; font-size:11px; color:var(--text-dim); }
  .pending-chip .x{ cursor:pointer; color:var(--text-faint); display:flex; }
  .pending-chip .x:hover{ color:var(--danger); }
  #composerRow{ display:flex; align-items:flex-end; gap:5px; }
  .prompt-glyph{ color:var(--gold); font-size:13.5px; padding:9px 0 9px 2px; flex:none; }
  #composerRow textarea{
    flex:1; resize:none; border:none; background:transparent; color:var(--text);
    font-size:13.5px; line-height:1.5; padding:8px 2px; max-height:150px; font-family:inherit; caret-color:var(--accent);
  }
  #composerRow textarea:focus{ outline:none; }
  #composerRow textarea::placeholder{ color:var(--text-faint); }
  .icon-btn{ width:33px;height:33px;border-radius:var(--radius);border:1px solid transparent;background:none;color:var(--text-dim);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center; }
  .icon-btn:hover{ background:var(--surface-3); color:var(--accent); }
  #sendBtn{ background:var(--accent); color:var(--accent-text); border-radius:var(--radius); }
  #sendBtn:hover{ filter:brightness(1.12); }
  #sendBtn:disabled{ opacity:.3; cursor:default; }
  #micBtn{ position:relative; }
  #micBtn.rec{ background:var(--danger); color:#fff; animation:micPulse 1.2s ease-in-out infinite; }
  @keyframes micPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,92,92,.45); } 50%{ box-shadow:0 0 0 6px rgba(255,92,92,0); } }
  #micLangBtn{
    flex:none; background:none; border:1px solid var(--border); color:var(--text-faint);
    font-family:inherit; font-size:9.5px; font-weight:700; letter-spacing:.3px; border-radius:5px;
    padding:0 5px; height:20px; align-self:center; cursor:pointer; margin-left:1px;
  }
  #micLangBtn:hover{ color:var(--accent); border-color:var(--accent-2); }
  #micEngineBtn{
    flex:none; background:none; border:1px solid var(--border); color:var(--text-faint);
    font-family:inherit; font-size:9px; font-weight:700; letter-spacing:.3px; border-radius:5px;
    padding:0 5px; height:20px; align-self:center; cursor:pointer; margin-left:1px;
  }
  #micEngineBtn:hover{ color:var(--accent); border-color:var(--accent-2); }
  #micEngineBtn.ai{ color:var(--gold); border-color:var(--gold); }
  #micStatus{
    display:none; align-items:center; gap:6px; font-size:10.5px; color:var(--danger);
    padding:0 0 6px 2px;
  }
  #micStatus.show{ display:flex; }
  #micStatus .dot{ width:6px;height:6px;border-radius:50%;background:var(--danger); animation:pulse 1s ease-in-out infinite; }
  #hint{ max-width:760px; margin:8px auto 0; font-size:10px; color:var(--text-faint); text-align:center; }

  /* ---------- modals ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(2,4,3,.72); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--surface); border:1px solid var(--border); border-radius:8px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto; }
  .modal-box.wide{ max-width:860px; }
  .modal-head{ padding:13px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:13.5px; color:var(--accent); }
  .modal-head .close{ cursor:pointer; color:var(--text-faint); display:flex; padding:4px; border-radius:5px; }
  .modal-head .close:hover{ color:var(--text); }
  .modal-body{ padding:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .choice-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; }
  .scheme-dots{ display:flex; gap:8px; }
  .scheme-dot{ width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent; }
  .scheme-dot.green{ background:#3dffa0; } .scheme-dot.amber{ background:#ffb000; } .scheme-dot.cyan{ background:#37e6ff; }
  .scheme-dot.active{ border-color:var(--text); }
  .toggle-sw{ width:38px;height:21px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;flex:none; }
  .toggle-sw .knob{ position:absolute; top:2px; left:2px; width:15px;height:15px;border-radius:50%;background:var(--text-faint); transition:transform .15s, background .15s; }
  .toggle-sw.on{ border-color:var(--accent-2); }
  .toggle-sw.on .knob{ transform:translateX(17px); background:var(--accent); }
  .modal-box img.viewer-img{ width:100%; border-radius:6px; display:block; }
  .modal-box iframe.viewer-pdf{ width:100%; height:70vh; border:none; border-radius:6px; background:#fff; }
  .btn-primary{ background:var(--accent); color:var(--accent-text); border:none; padding:10px 14px; border-radius:var(--radius); font-weight:700; font-size:12.5px; cursor:pointer; width:100%; font-family:inherit; }
  .btn-primary:hover{ filter:brightness(1.1); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:4px; }

  @media (max-width:860px){
    #sidebar{ position:fixed; left:0; top:0; height:100%; transform:translateX(-100%); transition:transform .2s ease; box-shadow:10px 0 24px rgba(0,0,0,.5); }
    #sidebar.open{ transform:translateX(0); }
    #closeSidebarBtn{ display:flex; }
    #menuBtn{ display:flex; }
    #hint{ display:none; }
    .msg-row{ padding:0 12px; gap:7px; }
    .msg-row .tag{ width:44px; font-size:10px; }
  }

  /* ---------- exchange section (added) ---------- */
  #exchangeBtn{
    margin:0 12px 6px; padding:9px 11px; background:transparent; color:var(--gold);
    border:1px solid rgba(240,185,11,.45); border-radius:var(--radius); font-family:inherit;
    font-weight:600; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px; width:calc(100% - 24px);
  }
  #exchangeBtn:hover, #exchangeBtn.active{ background:rgba(240,185,11,.12); }
  #exchangeBtn .tag{ margin-left:auto; font-size:9.5px; letter-spacing:.08em; color:var(--text-faint); }
  #exchangeView{
    position:fixed; top:0; right:0; bottom:0; left:250px; z-index:50;
    background:#020617; display:none; flex-direction:column;
  }
  #exchangeView.show{ display:flex; }
  #exchangeBar{
    height:var(--topbar-h); flex:none; display:flex; align-items:center; gap:10px; padding:0 14px;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  #exchangeBar .xtitle{ font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #exchangeBar .xtitle b{ color:var(--gold); font-weight:700; letter-spacing:.04em; }
  #exchangeBar button{
    background:none; border:1px solid var(--border); color:var(--text-dim); font-family:inherit; font-size:12px;
    padding:6px 10px; border-radius:var(--radius); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #exchangeBar button:hover{ color:var(--accent); border-color:var(--accent-2); }
  #exchangeFrame{ flex:1; width:100%; border:0; background:#020617; }
  @media (max-width:860px){ #exchangeView{ left:0; z-index:70; } }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<canvas id="btcLayer"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="backdrop"></div>

<div id="sidebar">
  <div class="brand">
    <div class="brand-mark">ET</div>
    <div>
      <div class="brand-name">ET AI</div>
      <div class="brand-sub">crypto research terminal</div>
    </div>
    <button id="closeSidebarBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <button id="newChatBtn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>

<script>
(function(){
"use strict";

/* ================= matrix rain ================= */
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
const btcCanvas = document.getElementById('btcLayer');
const btcCtx = btcCanvas.getContext('2d');
let w,h,cols,drops,coinDrops,rainOn = (localStorage.getItem('cipher_rain') !== 'off');
const glyphs = "01ΞΘBTCETHΔ¥$€₿アイウエオカキク".split("");

/* recognizable Bitcoin logo drawn on its own crisp canvas — official orange
   circle, the ₿ glyph in bold white, plus the two short tick marks top/bottom
   that make the real Bitcoin mark instantly readable, even small. Drawn on a
   canvas that's fully cleared every frame (no trailing/fade), so it stays sharp. */
function drawCoin(x, y, size, alpha){
  btcCtx.save();
  btcCtx.globalAlpha = alpha;
  const r = size/2;

  // official bitcoin-orange coin body with a subtle radial shine
  const grad = btcCtx.createRadialGradient(x-r*0.35, y-r*0.35, r*0.15, x, y, r);
  grad.addColorStop(0, '#ffb14d');
  grad.addColorStop(1, '#f7931a');
  btcCtx.beginPath();
  btcCtx.arc(x, y, r, 0, Math.PI*2);
  btcCtx.fillStyle = grad;
  btcCtx.fill();
  btcCtx.lineWidth = Math.max(1, size*0.045);
  btcCtx.strokeStyle = '#c9740d';
  btcCtx.stroke();

  // the ₿ glyph, bold and white, sized to fill most of the coin
  btcCtx.fillStyle = '#ffffff';
  btcCtx.font = `800 ${Math.round(size*0.66)}px 'JetBrains Mono', monospace`;
  btcCtx.textAlign = 'center';
  btcCtx.textBaseline = 'middle';
  btcCtx.fillText('₿', x, y + size*0.03);

  // the two short tick marks above/below the glyph — the real logo's signature
  const tickW = Math.max(1, size*0.07);
  const tickH = size*0.12;
  btcCtx.strokeStyle = '#ffffff';
  btcCtx.lineWidth = tickW;
  btcCtx.lineCap = 'round';
  btcCtx.beginPath();
  btcCtx.moveTo(x - size*0.09, y - r*0.72);
  btcCtx.lineTo(x - size*0.09, y - r*0.72 + tickH);
  btcCtx.moveTo(x + size*0.14, y - r*0.72);
  btcCtx.lineTo(x + size*0.14, y - r*0.72 + tickH);
  btcCtx.moveTo(x - size*0.09, y + r*0.72 - tickH);
  btcCtx.lineTo(x - size*0.09, y + r*0.72);
  btcCtx.moveTo(x + size*0.14, y + r*0.72 - tickH);
  btcCtx.lineTo(x + size*0.14, y + r*0.72);
  btcCtx.stroke();

  btcCtx.restore();
}

function resizeRain(){
  w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
  btcCanvas.width = w; btcCanvas.height = h;
  cols = Math.floor(w/16); drops = new Array(cols).fill(0).map(()=>Math.random()*-40);
  // coins scattered freely across the full width, not tied to the text grid,
  // so they're spread all over the screen rather than a few narrow lanes
  const coinCount = Math.max(4, Math.round(w/320));
  coinDrops = new Array(coinCount).fill(0).map(()=>({
    x: Math.random()*w,
    y: Math.random()*h - h, // start scattered above and within the view
    speed: 0.45 + Math.random()*0.75,
    size: 26 + Math.random()*26,
    drift: (Math.random()-0.5)*0.4
  }));
}
window.addEventListener('resize', resizeRain);
resizeRain();
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawRain(){
  if(!rainOn || reduceMotion){ ctx.clearRect(0,0,w,h); return; }
  ctx.fillStyle = 'rgba(5,8,7,0.15)'; ctx.fillRect(0,0,w,h);
  ctx.font = '14px JetBrains Mono, monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#3dffa0';
  for(let i=0;i<cols;i++){
    const t = glyphs[Math.floor(Math.random()*glyphs.length)];
    const x = i*16, y = drops[i]*16;
    ctx.fillStyle = Math.random() > 0.96 ? '#f0b90b' : accentColor;
    ctx.fillText(t, x, y);
    if(y > h && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawRain, 60);

/* coins animate on their own requestAnimationFrame loop, timed by real elapsed
   time rather than the matrix rain's fixed 60ms tick. That keeps their motion
   perfectly smooth (no stutter/shake), and rounding to whole pixels before
   each draw stops the text/shape edges from flickering as they move. */
let lastCoinTick = performance.now();
function animateCoins(now){
  const dt = Math.min(50, now - lastCoinTick); // cap so a stalled tab doesn't jump the coins
  lastCoinTick = now;
  btcCtx.clearRect(0,0,w,h);
  if(rainOn && !reduceMotion){
    coinDrops.forEach(c=>{
      drawCoin(Math.round(c.x), Math.round(c.y), c.size, 1);
      c.y += c.speed*16 * (dt/60);
      c.x += c.drift * (dt/60);
      if(c.x < -c.size) c.x = w + c.size;
      if(c.x > w + c.size) c.x = -c.size;
      if(c.y > h + c.size){
        c.y = -c.size*2;
        c.x = Math.random()*w;
        c.speed = 0.45 + Math.random()*0.75;
        c.size = 26 + Math.random()*26;
        c.drift = (Math.random()-0.5)*0.4;
      }
    });
  }
  requestAnimationFrame(animateCoins);
}
requestAnimationFrame(animateCoins);

/* ================= sound ================= */
let audioCtx = null;
let soundOn = localStorage.getItem('cipher_sound') === 'on';
function ensureCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  return audioCtx;
}
function beep(freq,dur,type,vol){
  if(!soundOn) return;
  const ac = ensureCtx(); if(!ac) return;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type||'square'; osc.frequency.value = freq; gain.gain.value = vol!=null?vol:0.05;
  osc.connect(gain); gain.connect(ac.destination);
  const now = ac.currentTime;
  gain.gain.setValueAtTime(gain.gain.value, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.start(now); osc.stop(now+dur);
}
function keySound(){ beep(320+Math.random()*140,0.03,'square',0.022); }
function sendSound(){ beep(660,0.05,'triangle',0.06); setTimeout(()=>beep(880,0.06,'triangle',0.06),60); }
function replySound(){ beep(220,0.08,'sine',0.05); }
function errSound(){ beep(160,0.15,'sawtooth',0.06); }
function fileSound(){ beep(500,0.05,'triangle',0.05); setTimeout(()=>beep(700,0.05,'triangle',0.05),70); }
/* premium mechanical-keyboard click used while the assistant's reply types
   itself out — modeled on real keyboard-typing SFX: a short crisp "click"
   transient (the switch snapping) immediately followed by a tiny low
   "thock" (the key bottoming out on the plate). Pitch and tone are jittered
   per hit so a fast run of keystrokes sounds natural, not looped/robotic. */
function typeTickSound(){
  if(!soundOn) return;
  const ac = ensureCtx(); if(!ac) return;
  const now = ac.currentTime;

  // the "click" — a short bright noise transient (switch snap)
  const bufSize = Math.floor(ac.sampleRate * 0.016);
  const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 1.6); }
  const noise = ac.createBufferSource(); noise.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 2800 + Math.random()*1000; bp.Q.value = 1.2;
  const noiseGain = ac.createGain(); noiseGain.gain.value = 0.055;
  noise.connect(bp); bp.connect(noiseGain); noiseGain.connect(ac.destination);
  noise.start(now); noise.stop(now+0.016);

  // the "thock" — a tiny pitched knock right after, gives the click a
  // satisfying low-end body so it reads as an actual keypress
  const osc = ac.createOscillator(); const oscGain = ac.createGain();
  osc.type = 'sine';
  const pitch = 220 + Math.random()*80;
  osc.frequency.setValueAtTime(pitch*1.8, now+0.004);
  osc.frequency.exponentialRampToValueAtTime(pitch, now+0.03);
  oscGain.gain.setValueAtTime(0.0001, now+0.004);
  oscGain.gain.exponentialRampToValueAtTime(0.05, now+0.009);
  oscGain.gain.exponentialRampToValueAtTime(0.0001, now+0.05);
  osc.connect(oscGain); oscGain.connect(ac.destination);
  osc.start(now+0.004); osc.stop(now+0.05);
}
/* gentle two-tone chime looped while the agent is "analysing" / working */
function analyzingPulse(){ beep(480,0.09,'sine',0.032); setTimeout(()=>beep(660,0.11,'sine',0.026),110); }

function setSound(v){
  soundOn = v; localStorage.setItem('cipher_sound', v?'on':'off');
  $('#sndBtn').textContent = 'SND:' + (v?'ON':'OFF');
  $('#soundToggle').classList.toggle('on', v);
  if(v){ ensureCtx(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); beep(660,0.05,'triangle',0.06); }
}

/* ================= scheme ================= */
function setScheme(s){
  document.documentElement.setAttribute('data-scheme', s);
  localStorage.setItem('cipher_scheme', s);
  document.querySelectorAll('.scheme-dot').forEach(d=> d.classList.toggle('active', d.dataset.scheme===s));
}
function setRain(v){
  rainOn = v; localStorage.setItem('cipher_rain', v?'on':'off');
  $('#rainToggle').classList.toggle('on', v);
  if(!v){ ctx.clearRect(0,0,w,h); btcCtx.clearRect(0,0,w,h); }
}

/* ================= ticker — live Binance prices ================= */
const coins = [
  {sym:'BTC', pair:'btcusdt', price:96420, ch:1.8}, {sym:'ETH', pair:'ethusdt', price:3610, ch:-0.9},
  {sym:'SOL', pair:'solusdt', price:214, ch:4.2}, {sym:'BNB', pair:'bnbusdt', price:712, ch:0.4},
  {sym:'XRP', pair:'xrpusdt', price:2.31, ch:-1.6}, {sym:'DOGE', pair:'dogeusdt', price:0.21, ch:6.1},
];
const coinsByPair = Object.fromEntries(coins.map(c=>[c.pair, c]));
function renderTicker(){
  const items = coins.map(c=>{
    const dir = c.ch>=0?'up':'down', arrow = c.ch>=0?'▲':'▼';
    const priceStr = c.price>=100 ? c.price.toLocaleString('en-US',{maximumFractionDigits:0}) : c.price.toFixed(c.price>=1?2:4);
    return `<span class="${dir}"><b>${c.sym}</b>$${priceStr} ${arrow} ${Math.abs(c.ch).toFixed(1)}%</span>`;
  }).join('');
  document.getElementById('ticker').innerHTML = items+items;
}
renderTicker();

/* fallback: gently drifts prices locally so the ticker never looks dead —
   only runs until the live Binance socket takes over */
let binanceLive = false;
const simFallback = setInterval(()=>{
  if(binanceLive) return;
  coins.forEach(c=>{
    const delta = (Math.random()-0.5)*(c.price*0.004);
    c.price = Math.max(0.0001, c.price+delta);
    c.ch = c.ch*0.85 + (delta/c.price*100)*3;
  });
  renderTicker();
}, 2200);

let binanceSocket = null, binanceRetryDelay = 2000;
function connectBinanceTicker(){
  try{
    const streams = coins.map(c=>`${c.pair}@ticker`).join('/');
    binanceSocket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);
  } catch(e){ scheduleBinanceRetry(); return; }

  binanceSocket.onopen = ()=>{ binanceLive = true; binanceRetryDelay = 2000; };
  binanceSocket.onmessage = ev=>{
    let payload; try{ payload = JSON.parse(ev.data); }catch(e){ return; }
    const d = payload && payload.data; if(!d || !d.s) return;
    const c = coinsByPair[d.s.toLowerCase()]; if(!c) return;
    const last = parseFloat(d.c), changePct = parseFloat(d.P);
    if(!isNaN(last)) c.price = last;
    if(!isNaN(changePct)) c.ch = changePct;
    renderTicker();
  };
  binanceSocket.onerror = ()=>{ try{ binanceSocket.close(); }catch(e){} };
  binanceSocket.onclose = ()=>{ binanceLive = false; scheduleBinanceRetry(); };
}
function scheduleBinanceRetry(){
  setTimeout(connectBinanceTicker, binanceRetryDelay);
  binanceRetryDelay = Math.min(binanceRetryDelay*1.6, 20000);
}
if(window.WebSocket) connectBinanceTicker();

/* ================= storage helpers ================= */
const LS_KEYS = { sessions:'cipher_sessions' };
const loadJSON = (k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const saveJSON = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };

let sessions = loadJSON(LS_KEYS.sessions, []);
let activeId = null;
let pendingFiles = [];
let busy = false;
let workingRow = null, workingTimer = null;
const workingStages = ['parsing query...', 'scanning ledger nodes...', 'cross-referencing sources...', 'compiling response...'];

function stripHeavyData(list){
  return (list||[]).map(s=>{
    const copy = Object.assign({}, s);
    copy.messages = (s.messages||[]).map(m=>{
      const mm = Object.assign({}, m);
      if(mm.attachments) mm.attachments = mm.attachments.map(a=>({name:a.name, mime:a.mime, size:a.size}));
      if(mm.files) mm.files = mm.files.map(f=>{ const g=Object.assign({},f); delete g.dataUrl; return g; });
      return mm;
    });
    return copy;
  });
}
function persist(){ if(!saveJSON(LS_KEYS.sessions, sessions)) saveJSON(LS_KEYS.sessions, stripHeavyData(sessions)); }

/* ================= DOM refs ================= */
const $ = sel => document.querySelector(sel);
const messagesEl = $('#messages');
const chatListEl = $('#chatList');
const chatTitleEl = $('#chatTitle');
const promptInput = $('#promptInput');
const sendBtn = $('#sendBtn');
const pendingFilesEl = $('#pendingFiles');
const sidebar = $('#sidebar');
const backdrop = $('#backdrop');

const isMobile = ()=> window.matchMedia('(max-width: 860px)').matches;

/* init theme/sound/rain from storage */
setScheme(localStorage.getItem('cipher_scheme') || 'green');
setSound(soundOn);
setRain(rainOn);

/* ================= panels ================= */
function openSidebar(){ sidebar.classList.add('open'); if(isMobile()) backdrop.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); syncBackdrop(); }
function syncBackdrop(){
  if(sidebar.classList.contains('open')){ if(isMobile()) backdrop.classList.add('show'); }
  else backdrop.classList.remove('show');
}
backdrop.addEventListener('click', ()=>{ closeSidebar(); });
$('#menuBtn').addEventListener('click', openSidebar);
$('#closeSidebarBtn').addEventListener('click', closeSidebar);

/* ================= utils ================= */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function formatBytes(n){ if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(2)+' MB'; }
function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

if(window.marked){ marked.setOptions({ breaks:true, gfm:true }); }
function renderMarkdown(md){
  if(!md) return '';
  if(!window.marked || !window.DOMPurify) return escapeHtml(md).replace(/\n/g,'<br>');
  try{ return DOMPurify.sanitize(marked.parse(md), {ADD_ATTR:['target']}); }
  catch(e){ return escapeHtml(md).replace(/\n/g,'<br>'); }
}

function startWorking(){
  stopWorking();
  workingRow = document.createElement('div');
  workingRow.className = 'working-row';
  workingRow.innerHTML = '<div class="tag">et ai</div><div class="working-card"><div class="working-head"><span class="working-spinner"></span><span>processing...</span></div><div class="working-step"></div></div>';
  messagesEl.appendChild(workingRow);
  const step = workingRow.querySelector('.working-step');
  let i=0;
  const update = ()=>{ step.textContent = workingStages[i++ % workingStages.length]; analyzingPulse(); scrollToBottom(); };
  update();
  workingTimer = setInterval(update, 1300);
  scrollToBottom();
}
function stopWorking(){
  if(workingTimer){ clearInterval(workingTimer); workingTimer=null; }
  if(workingRow){ workingRow.remove(); workingRow=null; }
}

/* ================= session management ================= */
function newSession(){
  const s = { id:uid(), title:'new_session', messages:[] };
  sessions.unshift(s); activeId = s.id;
  persist(); renderSessionList(); renderActiveSession(); closeSidebar();
}
function getActive(){ return sessions.find(s=>s.id===activeId); }

function renderSessionList(){
  chatListEl.innerHTML='';
  sessions.forEach(s=>{

function openViewer(title, kind, src){
  $('#viewerTitle').textContent = title;
  const body = $('#viewerBody'); body.innerHTML='';
  if(kind==='image'){ const img=document.createElement('img'); img.className='viewer-img'; img.src=src; body.appendChild(img); }
  else { const ifr=document.createElement('iframe'); ifr.className='viewer-pdf'; ifr.src=src; body.appendChild(ifr); }
  const dl = document.createElement('button'); dl.className='btn-primary'; dl.style.marginTop='12px'; dl.textContent='download';
  dl.addEventListener('click', async ()=>{
    let downloadHref = src;
    let revoke = false;
    try{
      if(/^https?:\/\//i.test(src)){
        const resp = await fetch(src);
        if(!resp.ok) throw new Error('fetch failed');
        const blob = await resp.blob();
        downloadHref = URL.createObjectURL(blob);
        revoke = true;
      }
      const a=document.createElement('a'); a.href=downloadHref; a.download=title||'download'; document.body.appendChild(a); a.click(); a.remove();
    }catch(err){
      window.open(src, '_blank');
    }finally{
      if(revoke) setTimeout(()=>URL.revokeObjectURL(downloadHref), 4000);
    }
  });
  body.appendChild(dl);
  $('#viewerModal').classList.add('open');
}

/* ================= voice input (mic) =================
   Two engines, switchable with the FREE/AI chip:
   - FREE: the browser's built-in SpeechRecognition (Web Speech API).
     No cost, no backend call, but only reliable in Chrome/Edge and a
     bit less accurate for Bangla. This is the default.
   - AI: records audio with MediaRecorder and sends it to our own
     server (/api/transcribe), which forwards it to OpenAI's
     transcription model. More accurate, works in every browser, but
     needs OPENAI_API_KEY configured with billing/credits on the server.
   The BN/EN chip picks the spoken language for whichever engine is
   active. Both write into the same textarea the same way. */
(function initVoiceInput(){
  const micBtn = $('#micBtn');
  const micLangBtn = $('#micLangBtn');
  const micEngineBtn = $('#micEngineBtn');
  const micStatus = $('#micStatus');
  const micStatusText = $('#micStatusText');

  const LANGS = {
    bn: { speechCode:'bn-BD', apiCode:'bn', label:'BN', listening:'Listening\u2026' },
    en: { speechCode:'en-US', apiCode:'en', label:'EN', listening:'Listening\u2026' }
  };
  let micLang = localStorage.getItem('cipher_mic_lang') || 'bn';
  if(!LANGS[micLang]) micLang = 'bn';
  micLangBtn.textContent = LANGS[micLang].label;

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hasRecorder = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  let engine = localStorage.getItem('cipher_mic_engine') || 'free';
  if(engine==='free' && !SpeechRecognitionAPI && hasRecorder) engine = 'ai';
  if(engine==='ai' && !hasRecorder && SpeechRecognitionAPI) engine = 'free';
  function refreshEngineBtn(){
    micEngineBtn.textContent = engine==='ai' ? 'AI' : 'FREE';
    micEngineBtn.classList.toggle('ai', engine==='ai');
  }
  refreshEngineBtn();

  if(!SpeechRecognitionAPI && !hasRecorder){
    micBtn.addEventListener('click', ()=> alert('\u098f\u0987 \u09ac\u09cd\u09b0\u09be\u0989\u099c\u09be\u09b0\u09c7 \u09ad\u09df\u09c7\u09b8 \u0987\u09a8\u09aa\u09c1\u099f \u09b8\u09be\u09aa\u09cb\u09b0\u09cd\u099f \u0995\u09b0\u09c7 \u09a8\u09be\u0964'));
    micLangBtn.style.display = 'none';
    micEngineBtn.style.display = 'none';
    return;
  }
  if(!SpeechRecognitionAPI || !hasRecorder) micEngineBtn.style.display = 'none'; // only one engine available, nothing to switch

  let recording = false, transcribing = false;

  function setIcon(state){
    micBtn.innerHTML = state==='stop'
      ? '<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>'
      : '<svg class="ic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  }
  function appendToPrompt(text){
    if(!text) return;
    const base = promptInput.value;
    const sep = base && !/\s$/.test(base) ? ' ' : '';
    promptInput.value = base + sep + text;
    promptInput.dispatchEvent(new Event('input'));
    promptInput.focus();
    scrollToBottom();
  }

  /* ---- FREE engine: Web Speech API ---- */
  let recognition = null, wantsFree = false, freeBase = '', freeFinal = '';
  function buildRecognition(){
    const rec = new SpeechRecognitionAPI();
    rec.lang = LANGS[micLang].speechCode;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = (e)=>{
      let interim = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal) freeFinal += (freeFinal && !/\s$/.test(freeFinal) ? ' ' : '') + res[0].transcript.trim();
        else interim += res[0].transcript;
      }
      const sep = freeBase && !/\s$/.test(freeBase) ? ' ' : '';
      const finalSep = freeFinal && interim ? ' ' : '';
      promptInput.value = freeBase + sep + freeFinal + finalSep + interim;
      promptInput.dispatchEvent(new Event('input'));
      scrollToBottom();
    };
    rec.onerror = (e)=>{
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){
        alert('\u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u09ab\u09cb\u09a8 \u09aa\u09be\u09b0\u09ae\u09bf\u09b6\u09a8 \u09a6\u09b0\u0995\u09be\u09b0\u0964 \u09ac\u09cd\u09b0\u09be\u0989\u099c\u09be\u09b0 \u09b8\u09c7\u099f\u09bf\u0982\u09b8 \u09a5\u09c7\u0995\u09c7 \u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u09ab\u09cb\u09a8 \u0985\u09cd\u09af\u09be\u0995\u09b8\u09c7\u09b8 \u09a6\u09be\u0993\u0964');
      } else if(e.error!=='no-speech' && e.error!=='aborted'){
        errSound();
      }
    };
    rec.onend = ()=>{
      recording = false; micBtn.classList.remove('rec'); micStatus.classList.remove('show');
      if(wantsFree){
        freeBase = promptInput.value; freeFinal = '';
        try{ rec.start(); recording = true; micBtn.classList.add('rec'); micStatus.classList.add('show'); }
        catch(err){ wantsFree = false; }
      }
    };
    return rec;
  }
  function startFree(){
    freeBase = promptInput.value; freeFinal = '';
    recognition = buildRecognition();
    try{
      recognition.start();
      recording = true; wantsFree = true;
      micBtn.classList.add('rec');
      micStatusText.textContent = LANGS[micLang].listening;
      micStatus.classList.add('show');
      fileSound();
    }catch(err){ /* ignore */ }
  }
  function stopFree(){
    wantsFree = false;
    if(recognition){ try{ recognition.stop(); }catch(err){} }
    recording = false; micBtn.classList.remove('rec'); micStatus.classList.remove('show');
  }

  /* ---- AI engine: record + /api/transcribe (OpenAI) ---- */
  const MICS = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  const pickedMime = (window.MediaRecorder && MediaRecorder.isTypeSupported) ? (MICS.find(t=>MediaRecorder.isTypeSupported(t)) || '') : '';
  let stream = null, recorder = null, chunks = [], autoStopTimer = null;
  const MAX_RECORD_MS = 120000;

  function blobToBase64(blob){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=> res(String(r.result).split(',')[1] || '');
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }
  async function startAi(){
    try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(err){ alert('\u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u09ab\u09cb\u09a8 \u09aa\u09be\u09b0\u09ae\u09bf\u09b6\u09a8 \u09a6\u09b0\u0995\u09be\u09b0\u0964 \u09ac\u09cd\u09b0\u09be\u0989\u099c\u09be\u09b0 \u09b8\u09c7\u099f\u09bf\u0982\u09b8 \u09a5\u09c7\u0995\u09c7 \u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u09ab\u09cb\u09a8 \u0985\u09cd\u09af\u09be\u0995\u09b8\u09c7\u09b8 \u09a6\u09be\u0993\u0964'); return; }
    chunks = [];
    try{ recorder = pickedMime ? new MediaRecorder(stream, { mimeType: pickedMime }) : new MediaRecorder(stream); }
    catch(err){ recorder = new MediaRecorder(stream); }
    recorder.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = onAiStopped;
    recorder.start();
    recording = true;
    micBtn.classList.add('rec'); setIcon('stop');
    micStatusText.textContent = LANGS[micLang].listening;
    micStatus.classList.add('show');
    fileSound();
    autoStopTimer = setTimeout(()=>{ if(recording) stopAi(); }, MAX_RECORD_MS);
  }
  function stopAi(){
    if(!recording) return;
    recording = false; clearTimeout(autoStopTimer);
    micBtn.classList.remove('rec'); setIcon('mic');
    try{ recorder.stop(); }catch(err){}
  }
  async function onAiStopped(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    const mime = (recorder && recorder.mimeType) || pickedMime || 'audio/webm';
    const blob = new Blob(chunks, { type: mime });
    chunks = [];
    if(blob.size < 800){ micStatus.classList.remove('show'); return; }
    transcribing = true; micBtn.disabled = true;
    micStatusText.textContent = '\u09b0\u09c2\u09aa\u09be\u09a8\u09cd\u09a4\u09b0 \u0995\u09b0\u09be \u09b9\u099a\u09cd\u099b\u09c7\u2026';
    micStatus.classList.add('show');
    try{
      const dataBase64 = await blobToBase64(blob);
      const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
      const resp = await fetch('/api/transcribe', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ filename:`voice.${ext}`, mime, dataBase64, language: LANGS[micLang].apiCode })
      });
      const data = await resp.json().catch(()=>({}));
      if(!resp.ok || data.ok===false) throw new Error((data.error && data.error.message) || 'transcription failed');
      appendToPrompt((data.text||'').trim());
    }catch(err){
      errSound();
      alert('\u09ad\u09df\u09c7\u09b8 \u099f\u09c7\u0995\u09cd\u09b8\u099f\u09c7 \u09b0\u09c2\u09aa\u09be\u09a8\u09cd\u09a4\u09b0 \u0995\u09b0\u09a4\u09c7 \u09b8\u09ae\u09b8\u09cd\u09af\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7: ' + (err.message || err));
    }finally{
      transcribing = false; micBtn.disabled = false; micStatus.classList.remove('show');
    }
  }

  /* ---- shared controls ---- */
  function start(){ if(engine==='ai') startAi(); else startFree(); }
  function stop(){ if(engine==='ai') stopAi(); else stopFree(); }

  micBtn.addEventListener('click', ()=>{
    if(busy || transcribing) return;
    if(recording) stop(); else start();
  });

  micLangBtn.addEventListener('click', ()=>{
    if(transcribing) return;
    micLang = micLang==='bn' ? 'en' : 'bn';
    localStorage.setItem('cipher_mic_lang', micLang);
    micLangBtn.textContent = LANGS[micLang].label;
    if(recording){ stop(); start(); }
  });

  micEngineBtn.addEventListener('click', ()=>{
    if(recording || transcribing) return;
    if(engine==='ai' && !SpeechRecognitionAPI) return; // nothing to switch to
    if(engine==='free' && !hasRecorder) return;
    engine = engine==='ai' ? 'free' : 'ai';
    localStorage.setItem('cipher_mic_engine', engine);
    refreshEngineBtn();
  });
})();

/* ================= typewriter for assistant replies =================
   Live assistant text reveals itself a few characters at a time with a soft
   tick sound, then snaps to full rendered markdown once it catches up to
   whatever has arrived so far. New text that streams in later (m.text grows)
   is picked up automatically and typing resumes from where it left off. */
const typers = new Map();
function ensureTyping(m){
  let state = typers.get(m.id);
  if(!state){ state = { revealed:0, timer:null }; typers.set(m.id, state); }
  if(state.timer) return;
  state.timer = setInterval(()=>{
    const row = messagesEl.querySelector(`[data-mid="${m.id}"]`);
    if(!row){ clearInterval(state.timer); state.timer=null; return; }
    const textEl = row.querySelector('.msg-text');
    const target = m.text || '';
    if(state.revealed >= target.length){
      clearInterval(state.timer); state.timer = null;
      if(textEl){ textEl.classList.remove('plain'); textEl.innerHTML = renderMarkdown(target); }
      scrollToBottom();
      return;
    }
    const step = 1 + Math.floor(Math.random()*2);
    state.revealed = Math.min(target.length, state.revealed + step);
    if(textEl){
      textEl.classList.add('plain');
      textEl.textContent = target.slice(0, state.revealed);
      textEl.insertAdjacentHTML('beforeend', '<span class="cursor-blink"></span>');
    }
    if(state.revealed % 3 === 0) typeTickSound();
    scrollToBottom();
  }, 22);
}

function appendAssistantMessage(s, text, files){
  const m = { id:uid(), role:'assistant', text:text||'', files:files||[] };
  s.messages.push(m); renderMessage(m, true); scrollToBottom();
  ensureTyping(m);
  return m;
}
function updateAssistantMessage(m, text, files){
  m.text = text || '';
  if(files && files.length) m.files = files;
  const row = messagesEl.querySelector(`[data-mid="${m.id}"]`);
  if(row){
    const extra = row.querySelector('.msg-extra');
    if(extra){
      extra.innerHTML = '';
      if(m.files && m.files.length) m.files.forEach(f=> appendFileToExtra(extra, f));
    }
  }
  ensureTyping(m);
  scrollToBottom();
}
function appendFileToExtra(extra, f){
  const src = f.dataUrl || f.url;
  const isImg = (f.mime||'').startsWith('image/');
  if(isImg && src){
    const img = document.createElement('img'); img.className='attach-thumb'; img.src=src; img.alt=f.name;
    img.addEventListener('click', ()=>openViewer(f.name,'image',src));
    extra.appendChild(img);
  } else {
    extra.appendChild(fileCard(f.name, f.mime||'application/octet-stream', f.size||0,
      ()=>{ if(src) openViewer(f.name, isImg?'image':'pdf', src); }, true));
  }
}

/* ================= MANUS backend integration =================
   Calls the /api/manus endpoint (task.create, task.sendMessage,
   task.listMessages, file.upload-content). The server must expose these
   routes with MANUS_API_KEY set; this HTML is frontend only. */
const MANUS_BASE = '/api/manus';

async function manusFetch(path, opts){
  const res = await fetch(MANUS_BASE + path, Object.assign({
    headers: Object.assign({'Content-Type':'application/json'}, (opts&&opts.headers)||{})
  }, opts||{}));
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('Bad response from Research Agent API'); }
  if(!data.ok){ throw new Error((data.error && data.error.message) || 'Research Agent API error'); }
  return data;
}
function dataUrlToBase64(durl){ return durl.split(',')[1]; }

async function manusUploadFile(f){
  if(!f.dataUrl) throw new Error(`Could not read ${f.name}. Please attach it again.`);
  const res = await fetch(MANUS_BASE + '/file.upload-content', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ filename:f.name, mime:f.mime||'application/octet-stream', dataBase64:dataUrlToBase64(f.dataUrl) })
  });
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error(`Upload response for ${f.name} was not valid.`); }
  if(!res.ok || !data.ok || !data.file || !data.file.id){
    throw new Error((data.error && data.error.message) || `Could not upload ${f.name}.`);
  }
  return data.file.id;
}

async function runManus(s, text, files){
  const content = [];
  if(text) content.push({ type:'text', text });
  for(const f of files){
    const fileId = await manusUploadFile(f);
    content.push({ type:'file', file_id: fileId });
  }
  if(content.length===0) content.push({ type:'text', text:'(see attached file)' });

  let data;
  if(s.manusTaskId){
    data = await manusFetch('/task.sendMessage', { method:'POST', body: JSON.stringify({ task_id:s.manusTaskId, message:{content} }) });
  } else {
    data = await manusFetch('/task.create', { method:'POST', body: JSON.stringify({ message:{content} }) });
    s.manusTaskId = data.task_id;
    persist();
  }
  await pollManusTask(s);
}

function describeManusEvent(ev){
  const type = ev.type || 'step';
  const payload = ev[type] || {};
  const pick = (obj, keys)=>{ for(const k of keys){ if(obj && obj[k]) return obj[k]; } return null; };
  const url = pick(payload, ['url','link','target_url','page_url','source_url','href']);
  const query = pick(payload, ['query','search_query','q','keywords']);
  const title = pick(payload, ['title','page_title','name']);
  const toolName = pick(payload, ['tool_name','tool','function_name','action_name']);
  const text = pick(payload, ['description','text','thought','message','summary','content']);
  const lowerType = type.toLowerCase();

  if(query || lowerType.includes('search')) return { icon:'🔍', label:'searching the web', detail: query || text || '' };
  if(url || lowerType.includes('browse') || lowerType.includes('navigate') || lowerType.includes('visit') || lowerType.includes('fetch') || lowerType.includes('page')){
    let host=''; try{ host = url ? new URL(url).hostname.replace(/^www\./,'') : ''; }catch(e){ host = url || ''; }
    return { icon:'🌐', label: host ? `visiting ${host}` : 'browsing a page', detail: title || url || text || '' };
  }
  if(lowerType.includes('read') || lowerType.includes('file')) return { icon:'📄', label: title ? `reading ${title}` : 'reading a file', detail: text || '' };
  if(lowerType.includes('plan') || lowerType.includes('think')) return { icon:'🧠', label:'planning next step', detail: text || '' };
  if(lowerType.includes('code') || lowerType.includes('execut') || lowerType.includes('shell') || lowerType.includes('command')) return { icon:'🛠️', label: toolName ? `running ${toolName}` : 'running a command', detail: text || '' };
  if(toolName) return { icon:'🛠️', label: `using ${toolName}`, detail: text || '' };
  return { icon:'⚙️', label: type.replace(/_/g,' '), detail: text || '' };
}

function extractFiles(msg){
  const out = [];
  const candidates = [];
  const add = value=>{ if(Array.isArray(value)) candidates.push(...value); else if(value) candidates.push(value); };
  add(msg && msg.files); add(msg && msg.attachments); add(msg && msg.output_files); add(msg && msg.outputFiles);
  add(msg && msg.file);
  add(msg && msg.assistant_message && msg.assistant_message.attachments);
  add(msg && msg.assistant_message && msg.assistant_message.files);
  candidates.forEach(f=>{
    if(!f || typeof f !== 'object') return;
    const type = String(f.content_type || f.mime_type || f.mime || f.type || '').toLowerCase();
    const mime = type.includes('/') ? type : (type==='image' ? 'image/*' : type==='file' ? 'application/octet-stream' : 'application/octet-stream');
    const url = f.url || f.download_url || f.downloadUrl || f.uri || f.href;
    const dataUrl = f.dataUrl || f.data_url || (f.data && mime.startsWith('image/') ? `data:${mime};base64,${f.data}` : undefined);
    if(url || dataUrl) out.push({ name:f.filename||f.name||'generated-file', mime, size:f.size||f.bytes||0, url, dataUrl });
  });
  return out;
}

/* ================= pdf export ================= */
function buildPdfDoc(title, text){
  if(!window.jspdf) return null;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin=48, pageWidth=doc.internal.pageSize.getWidth(), pageHeight=doc.internal.pageSize.getHeight();
  const maxWidth = pageWidth - margin*2;
  doc.setFontSize(14); doc.text(title||'ET AI Report', margin, margin);
  doc.setFontSize(10.5);
  const plain = text.replace(/[#*`|]/g,'').replace(/\n{2,}/g,'\n\n');
  const lines = doc.splitTextToSize(plain, maxWidth);
  let y = margin+26;
  lines.forEach(line=>{
    if(y > pageHeight-margin){ doc.addPage(); y=margin; }
    doc.text(line, margin, y); y += 14;
  });
  return doc;
}
function attachGeneratedPdf(s, m, row, coin){
  const doc = buildPdfDoc(`ET AI — ${coin.sym} report`, m.text);
  if(!doc) return;
  const filename = `cipher-${coin.sym.toLowerCase()}-report.pdf`;
  const dataUrl = doc.output('datauristring');
  m.files = [{ name:filename, mime:'application/pdf', size:Math.round(dataUrl.length*3/4), dataUrl }];
  const extra = row.querySelector('.msg-extra');
  extra.appendChild(fileCard(filename, 'application/pdf', m.files[0].size, ()=>openViewer(filename,'pdf',dataUrl), true));
  fileSound();
}

/* ET Exchange section (added) — loads /exchange/ in an isolated frame, leaves the rest of the app untouched */
(function(){
  const view=document.getElementById('exchangeView'), frame=document.getElementById('exchangeFrame');
  const btn=document.getElementById('exchangeBtn');
  function openX(){
    if(!frame.getAttribute('src')) frame.setAttribute('src','/exchange/');
    view.classList.add('show'); btn.classList.add('active');
    const sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('open');
    const bd=document.getElementById('backdrop'); if(bd) bd.classList.remove('show');
  }
  function closeX(){ view.classList.remove('show'); btn.classList.remove('active'); }
  btn.addEventListener('click', openX);
  document.getElementById('exchangeBackBtn').addEventListener('click', closeX);
  document.getElementById('exchangeReloadBtn').addEventListener('click', ()=>{ frame.setAttribute('src','/exchange/'); });
  document.getElementById('newChatBtn').addEventListener('click', closeX);
  document.getElementById('chatList').addEventListener('click', closeX);
  document.getElementById('settingsBtn').addEventListener('click', closeX);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && view.classList.contains('show')) closeX(); });
})();
